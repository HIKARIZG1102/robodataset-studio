[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robodataset-studio"
version = "0.1.0"
description = "PySide6 desktop frontend with FastAPI local backend for robot dataset collection"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "PySide6>=6.6",
  "PyYAML>=6.0",
  "httpx>=0.26",
  "websockets>=12.0",
  "numpy>=1.26,<2",
  "h5py>=3.10",
  "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
upload = ["paramiko>=3.4"]

[project.scripts]
robodataset-studio = "robodataset_studio.frontend.main:main"
robodataset-studio-backend = "robodataset_studio.backend.main:main"

[tool.setuptools.packages.find]
where = ["src"]
