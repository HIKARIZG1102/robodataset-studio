[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robodataset-studio-v3"
version = "0.1.0"
description = "PySide6 desktop frontend with FastAPI local backend for robot dataset collection"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "PySide6>=6.6",
  "PyYAML>=6.0",
  "httpx>=0.26",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
