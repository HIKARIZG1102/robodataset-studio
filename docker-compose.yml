services:
  robodataset-studio:
    image: robodataset-studio:latest
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    pid: host
    privileged: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: /tmp/robodataset-studio.Xauthority
      HOME: /workspace/robodataset-studio
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      ROS_SETUP: ${ROS_SETUP:-/opt/ros/humble/setup.bash}
      ROBODATASET_RMW_IMPLEMENTATION: ${ROBODATASET_RMW_IMPLEMENTATION:-}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-}
      ROBODATASET_DOCKER: "1"
      ROBODATASET_ALLOWED_ROOT: /workspace/robodataset-studio
    volumes:
      - .:/workspace/robodataset-studio
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/tmp/robodataset-studio.Xauthority:ro
      - /opt/ros:/opt/ros:ro
    devices: []
