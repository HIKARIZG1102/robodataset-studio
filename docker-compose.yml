services:
  robodataset-studio:
    image: robodataset-studio:latest
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    ipc: host
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DISPLAY: ${DISPLAY}
      XAUTHORITY: /workspace/robodataset-studio/.docker.Xauthority
      HOME: /workspace/robodataset-studio
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
      ROS_SETUP: ${ROS_SETUP:-/opt/ros/humble/setup.bash}
      ROBODATASET_RMW_IMPLEMENTATION: ${ROBODATASET_RMW_IMPLEMENTATION:-}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-}
      AMENT_PREFIX_PATH: ${AMENT_PREFIX_PATH:-}
      CMAKE_PREFIX_PATH: ${CMAKE_PREFIX_PATH:-}
      COLCON_PREFIX_PATH: ${COLCON_PREFIX_PATH:-}
      LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:-}
      PYTHONPATH: ${PYTHONPATH:-}
      ROBODATASET_DOCKER: "1"
      ROBODATASET_ALLOWED_ROOT: /workspace/robodataset-studio
    volumes:
      - .:/workspace/robodataset-studio
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/workspace/robodataset-studio/.docker.Xauthority:ro
      - /opt/ros:/opt/ros:ro
    devices: []
