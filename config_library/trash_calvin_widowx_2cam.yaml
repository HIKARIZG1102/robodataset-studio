project:
  name: trash_calvin_widowx
  version: v1
  operator: ''
  created_at: '2026-06-11T22:50:00'
  environment: ''
environment:
  type: ''
  description: ''
  workspace: ''
  lighting: ''
  objects: []
  notes: ''
robot:
  name: widowx
  model: wx250s
  description: ''
  joint_count: 6
  joint_order:
  - waist
  - shoulder
  - elbow
  - forearm_roll
  - wrist_angle
  - wrist_rotate
  base_frame: ''
  end_effector_frame: ''
  joint_state_topic: /wx250s/joint_states
  action_topic: null
  gripper_state_topic: null
  control:
    enabled: false
    mode: external_controller_only
    publishes_commands: false
  action_format:
    type: delta_state_with_gripper
    dim: 7
    fields:
    - djoint_0
    - djoint_1
    - djoint_2
    - djoint_3
    - djoint_4
    - djoint_5
    - gripper
    gripper_convention: {}
instruction:
  text: ''
  language: ''
  task_family: ''
  success_condition: ''
cameras:
- name: rgb_static
  role: base
  topic: /camera/camera/color/image_raw
  type: sensor_msgs/msg/Image
  encoding: rgb8
  fps_target: 10
  crop:
    enabled: false
    x: 0
    y: 0
    width: 0
    height: 0
  resize:
    enabled: false
    width: 0
    height: 0
- name: rgb_wrist
  role: wrist
  topic: /camera/camera_wrist/color/image_raw
  type: sensor_msgs/msg/Image
  encoding: rgb8
  fps_target: 10
  crop:
    enabled: false
    x: 0
    y: 0
    width: 0
    height: 0
  resize:
    enabled: false
    width: 0
    height: 0
streams:
- name: rgb_static
  modality: rgb
  source: ros2_topic
  topic: /camera/camera/color/image_raw
  message_type: sensor_msgs/msg/Image
  dtype: uint8
  shape:
  - 720
  - 1280
  - 3
  encoding: rgb8
  training_role: observation
  calvin_key: rgb_static
  required: true
  preview:
    renderer: image_rgb
    crop:
      enabled: false
      x: 0
      y: 0
      width: 0
      height: 0
    resize:
      enabled: false
      width: 0
      height: 0
- name: rgb_wrist
  modality: rgb
  source: ros2_topic
  topic: /camera/camera_wrist/color/image_raw
  message_type: sensor_msgs/msg/Image
  dtype: uint8
  shape:
  - 480
  - 848
  - 3
  encoding: rgb8
  training_role: observation
  calvin_key: rgb_wrist
  required: true
  preview:
    renderer: image_rgb
    crop:
      enabled: false
      x: 0
      y: 0
      width: 0
      height: 0
    resize:
      enabled: false
      width: 0
      height: 0
state:
  keys:
  - name: robot_obs
    source_topic: /wx250s/joint_states
    type: sensor_msgs/msg/JointState
    output_dim: 6
    fields:
    - joint_position
    joint_order:
    - waist
    - shoulder
    - elbow
    - forearm_roll
    - wrist_angle
    - wrist_rotate
action:
  name: rel_actions
  source: derived_from_robot_obs
  source_topic: /wx250s/joint_states
  source_action_topic: null
  gripper_state_topic: null
  format: delta_state_with_gripper
  dim: 7
  fields:
  - djoint_0
  - djoint_1
  - djoint_2
  - djoint_3
  - djoint_4
  - djoint_5
  - gripper
  include_default_gripper: true
  default_gripper: 1.0
runtime:
  mode: listener_only
  starts_external_nodes: false
  publishes_robot_commands: false
dataset:
  output_format:
  - npz
  - hdf5
  npz_schema: calvin_style
  calvin_like_transition_files: true
  hdf5_schema: pi05_calvin_hdf5
  requires_robot_obs: true
  requires_actions: true
  cache_root: /home/microsate/robot_datasets/robodataset_studio/raw_sessions/catch_the_satellite/v1
  merged_root: /home/microsate/robot_datasets/robodataset_studio/merged_calvin/catch_the_satellite/v1/training
  split: training
  episode_prefix: episode_
  write_language_annotations: true
  language_annotation_file: lang_annotations/auto_lang_ann.npy
recording:
  sample_rate_hz: 10
  stop_mode: duration_sec
  episode_duration_sec: 3.0
  target_samples: 30
  sync_policy: nearest_timestamp
  max_frame_lag_ms: 100
  min_episode_steps: 5
  auto_drop_empty_frames: true
  auto_drop_invalid_actions: true
